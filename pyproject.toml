[project]
name = "arxiv-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DeveshValluru", email = "devesh.valluru01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.4",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "langfuse>=4.17.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "lxml>=6.1.3",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "scikit-learn==1.6.1",
    "sentence-transformers>=6.1.0",
    "snowballstemmer>=3.1.1",
    "sse-starlette>=3.5.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
arxiv-agent = "arxiv_agent:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

# Linux (CI) gets CPU-only torch: PyPI's Linux wheels pull ~2.5 GB of CUDA
# libraries that a CPU runner never uses. Windows and macOS keep PyPI's.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
