# The Q&A eval gate (scripts/eval_gate.py): real models, real retrieval.
# Pull requests that touch the system run the PR suite (20 questions x 2);
# main runs the full suite (all questions x 2). It fails when correctness
# drops more than the eval's own noise explains (see evals/gate.py).
#
# Needs the HF_TOKEN secret (model calls, a few cents a run). Optional:
# LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY secrets to trace runs (environment
# "ci"), ARXIV_CONTACT_NAME / ARXIV_CONTACT_EMAIL variables for arXiv's
# User-Agent. The eval papers are fetched from arXiv once and cached.
name: Eval gate

on:
  pull_request:
    paths:
      - "src/**"
      - "evals/**"
      - "scripts/eval_gate.py"
      - "scripts/ingest_papers.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval-gate.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "evals/**"
      - "scripts/eval_gate.py"
      - "scripts/ingest_papers.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "pr (20 questions) or full (all)"
        type: choice
        options: [pr, full]
        default: full

# A newer push makes a running gate for the same branch pointless.
concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Q&A eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: arxiv
          POSTGRES_PASSWORD: arxiv
          POSTGRES_DB: arxiv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arxiv -d arxiv"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://arxiv:arxiv@127.0.0.1:5432/arxiv
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
      LANGFUSE_TRACING_ENVIRONMENT: ci
      ARXIV_CONTACT_NAME: ${{ vars.ARXIV_CONTACT_NAME }}
      ARXIV_CONTACT_EMAIL: ${{ vars.ARXIV_CONTACT_EMAIL }}
      SUITE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.suite || 'full' }}
    steps:
      - name: Check the model token
        if: env.HF_TOKEN == ''
        run: |
          echo "::error::The HF_TOKEN secret isn't set, so the gate can't call the models. Add it under Settings > Secrets and variables > Actions."
          exit 1
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-eval-${{ hashFiles('src/arxiv_agent/ingestion/embedder.py', 'src/arxiv_agent/retrieval/reranker.py') }}
      - name: Cache arXiv pages
        uses: actions/cache@v4
        with:
          path: data/html
          key: arxiv-html-${{ hashFiles('evals/qa_*.jsonl') }}
          restore-keys: arxiv-html-
      - name: Index the eval papers
        run: uv run python scripts/ingest_papers.py --from-evals
      - name: Gate
        run: uv run python scripts/eval_gate.py --suite "$SUITE" --concurrency 4
      # Scores and the verdict only: items.jsonl holds the answers, which
      # paraphrase papers, so it stays on the runner.
      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-${{ env.SUITE }}
          path: data/eval_runs/*/gate.json
          if-no-files-found: ignore
          retention-days: 30
